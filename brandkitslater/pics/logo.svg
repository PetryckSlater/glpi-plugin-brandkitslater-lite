<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 80" width="340" height="80">
  <defs>
    <linearGradient id="bkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <linearGradient id="bkGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#60a5fa" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#a78bfa" stop-opacity="0.8" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#4f46e5" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Modern Hexagon / Shield Brand Icon -->
  <g transform="translate(10, 10)">
    <!-- Base Icon Shape -->
    <rect x="0" y="0" width="60" height="60" rx="16" fill="url(#bkGrad)" filter="url(#shadow)" />
    
    <!-- Stylized 'B' / Layers -->
    <path d="M 20 18 L 35 18 C 41 18 45 21 45 26 C 45 30 42 32 37 33 C 43 34 46 37 46 42 C 46 48 41 51 34 51 L 20 51 Z" fill="none" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 20 34 L 35 34" fill="none" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" />
    <circle cx="44" cy="20" r="3" fill="#38bdf8" />
  </g>

  <!-- Typography -->
  <text x="86" y="44" font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="30" font-weight="800" fill="#0f172a" letter-spacing="-0.03em">Brand<tspan fill="url(#bkGrad)">Kit</tspan></text>
  <text x="88" y="62" font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif" font-size="9.5" font-weight="700" fill="#64748b" letter-spacing="0.18em">SLATER STUDIO • GLPI</text>
</svg>
